"public/index.html"

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ADEZ-MD | Multi Device</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  padding:20px;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
}

.header{
  text-align:center;
  margin:25px 0;
}

.header h1{
  font-size:42px;
  letter-spacing:5px;
  font-weight:900;
}

.header p{
  color:#777;
  margin-top:8px;
}

.card{
  background:#0d0d0d;
  border:1px solid #242424;
  border-radius:20px;
  padding:25px;
  margin-bottom:20px;
}

button{
  cursor:pointer;
}

.primary{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  background:#fff;
  color:#000;
  font-weight:900;
  font-size:15px;
}

.devices{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));
  gap:15px;
  margin-top:20px;
}

.device{
  background:#111;
  border:1px solid #292929;
  border-radius:15px;
  padding:18px;
}

.device h3{
  margin-bottom:12px;
}

.device p{
  color:#888;
  font-size:13px;
  margin:7px 0;
}

.badge{
  display:inline-block;
  background:#1c1c1c;
  border-radius:20px;
  padding:6px 10px;
  font-size:11px;
  margin:5px 0 12px;
}

.device button{
  width:100%;
  padding:11px;
  border-radius:9px;
  border:1px solid #333;
  background:#191919;
  color:#fff;
  margin-top:8px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.active{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:430px;
  background:#0d0d0d;
  border:1px solid #333;
  border-radius:20px;
  padding:25px;
}

.modal-box h2{
  text-align:center;
  margin-bottom:8px;
}

.modal-box p{
  text-align:center;
  color:#777;
  font-size:13px;
  line-height:1.5;
  margin-bottom:18px;
}

input{
  width:100%;
  padding:14px;
  background:#151515;
  border:1px solid #333;
  color:#fff;
  border-radius:10px;
  margin-bottom:10px;
  outline:none;
}

.code{
  font-size:28px;
  font-weight:900;
  text-align:center;
  letter-spacing:4px;
  padding:20px 5px;
}

.qr{
  width:300px;
  max-width:100%;
  display:block;
  margin:15px auto;
  background:#fff;
  padding:10px;
  border-radius:10px;
}

.close{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #333;
  background:#151515;
  color:#fff;
  margin-top:10px;
}

.message{
  text-align:center;
  color:#888;
  font-size:13px;
  margin-top:12px;
}

.danger{
  color:#ff6b6b;
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>ADEZ-MD</h1>

    <p>
      Multi-Device WhatsApp Pairing
    </p>

  </div>


  <div class="card">

    <button
      class="primary"
      onclick="createDevice()"
    >
      + PAIR NEW DEVICE
    </button>

    <div
      id="devices"
      class="devices"
    ></div>

  </div>

</div>


<!-- DEVICE MODAL -->

<div
  id="modal"
  class="modal"
>

  <div class="modal-box">

    <h2 id="modalTitle">
      ADEZ-MD Device
    </h2>

    <p id="modalText">
      Select a pairing method.
    </p>


    <button
      class="primary"
      onclick="showPair()"
    >
      PHONE NUMBER
    </button>

    <button
      class="close"
      onclick="showQR()"
    >
      QR CODE
    </button>


    <!-- PHONE -->

    <div
      id="pairArea"
      style="display:none;margin-top:20px;"
    >

      <input
        id="phone"
        type="tel"
        placeholder="254712345678"
      >

      <button
        class="primary"
        onclick="requestPairing()"
      >
        GET PAIRING CODE
      </button>

      <div
        id="pairCode"
        class="code"
      ></div>

    </div>


    <!-- QR -->

    <div
      id="qrArea"
      style="display:none;margin-top:20px;"
    >

      <img
        id="qrImage"
        class="qr"
        alt="ADEZ-MD QR"
      >

      <div
        id="qrText"
        class="message"
      >
        Waiting for QR...
      </div>

    </div>


    <button
      class="close"
      onclick="closeModal()"
    >
      CLOSE
    </button>

  </div>

</div>


<script>

let selectedDevice = null;


/*
|--------------------------------------------------------------------------
| Create device
|--------------------------------------------------------------------------
*/

async function createDevice(){

  try{

    const response =
      await fetch(
        "/api/device/create",
        {
          method:"POST"
        }
      );

    const data =
      await response.json();

    if(!data.success){

      alert(
        data.message ||
        "Could not create device."
      );

      return;
    }

    selectedDevice =
      data.deviceId;

    openModal(
      data.deviceId
    );

    loadDevices();

  }catch(error){

    alert(
      "Server connection failed."
    );

  }

}


/*
|--------------------------------------------------------------------------
| Load devices
|--------------------------------------------------------------------------
*/

async function loadDevices(){

  try{

    const response =
      await fetch(
        "/api/devices"
      );

    const data =
      await response.json();

    const container =
      document.getElementById(
        "devices"
      );

    container.innerHTML = "";

    if(
      !data.devices ||
      data.devices.length === 0
    ){

      container.innerHTML = `
        <p style="
          color:#777;
          text-align:center;
          grid-column:1/-1;
        ">
          No devices connected.
        Create your first device.
        </p>
      `;

      return;
    }


    data.devices.forEach(
      device => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "device";

        item.innerHTML = `

          <h3>
            ADEZ-MD Device
          </h3>

          <span class="badge">
            ${device.status}
          </span>

          <p>
            ID: ${device.id}
          </p>

          <p>
            Phone:
            ${device.phone || "Not paired"}
          </p>

          <button
            onclick="openExisting('${device.id}')"
          >
            MANAGE
          </button>

          <button
            onclick="logoutDevice('${device.id}')"
          >
            LOGOUT DEVICE
          </button>

        `;

        container.appendChild(
          item
        );

      }
    );

  }catch(error){

    console.error(error);

  }

}


/*
|--------------------------------------------------------------------------
| Open new device
|--------------------------------------------------------------------------
*/

function openModal(deviceId){

  selectedDevice =
    deviceId;

  document
    .getElementById("modal")
    .classList.add("active");

  document
    .getElementById("modalTitle")
    .textContent =
      "ADEZ-MD Device";

  document
    .getElementById("modalText")
    .textContent =
      "Choose phone pairing or QR pairing.";

  document
    .getElementById("pairArea")
    .style.display =
      "none";

  document
    .getElementById("qrArea")
    .style.display =
      "none";

}


/*
|--------------------------------------------------------------------------
| Open existing
|--------------------------------------------------------------------------
*/

function openExisting(deviceId){

  openModal(deviceId);

}


/*
|--------------------------------------------------------------------------
| Show phone pairing
|--------------------------------------------------------------------------
*/

function showPair(){

  document
    .getElementById("pairArea")
    .style.display =
      "block";

  document
    .getElementById("qrArea")
    .style.display =
      "none";

}


/*
|--------------------------------------------------------------------------
| Show QR
|--------------------------------------------------------------------------
*/

function showQR(){

  document
    .getElementById("pairArea")
    .style.display =
      "none";

  document
    .getElementById("qrArea")
    .style.display =
      "block";

  loadQR();

}


/*
|--------------------------------------------------------------------------
| Request pairing
|--------------------------------------------------------------------------
*/

async function requestPairing(){

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();

  if(!phone){

    alert(
      "Enter phone number with country code."
    );

    return;
  }


  const response =
    await fetch(
      `/api/device/${selectedDevice}/pair`,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          number:phone
        })

      }
    );


  const data =
    await response.json();


  if(data.success){

    document
      .getElementById("pairCode")
      .textContent =
        data.code;

  }else{

    alert(
      data.message ||
      "Pairing failed."
    );

  }

}


/*
|--------------------------------------------------------------------------
| Load QR
|--------------------------------------------------------------------------
*/

async function loadQR(){

  if(!selectedDevice)
    return;

  const image =
    document
      .getElementById("qrImage");

  const text =
    document
      .getElementById("qrText");


  try{

    const response =
      await fetch(
        `/api/device/${selectedDevice}/qr`
      );

    const data =
      await response.json();


    if(data.success){

      image.src =
        data.qr;

      image.style.display =
        "block";

      text.textContent =
        "Scan this QR code with WhatsApp.";

    }else{

      image.style.display =
        "none";

      text.textContent =
        "Waiting for WhatsApp QR code...";

      setTimeout(
        loadQR,
        2000
      );

    }

  }catch(error){

    text.textContent =
      "Unable to load QR.";

  }

}


/*
|--------------------------------------------------------------------------
| Logout
|--------------------------------------------------------------------------
*/

async function logoutDevice(
  deviceId
){

  if(
    !confirm(
      "Logout this ADEZ-MD device?"
    )
  ){

    return;

  }


  const response =
    await fetch(
      `/api/device/${deviceId}/logout`,
      {
        method:"POST"
      }
    );


  const data =
    await response.json();


  if(data.success){

    loadDevices();

  }else{

    alert(
      data.message ||
      "Logout failed."
    );

  }

}


/*
|--------------------------------------------------------------------------
| Close modal
|--------------------------------------------------------------------------
*/

function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("active");

  selectedDevice =
    null;

}


/*
|--------------------------------------------------------------------------
| Refresh device list
|--------------------------------------------------------------------------
*/

loadDevices();

setInterval(
  loadDevices,
  5000
);

</script>

</body>

</html>
