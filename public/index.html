<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADEZ-MD | Multi Device</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  padding:20px;
}

.container{
  max-width:850px;
  margin:auto;
}

.header{
  text-align:center;
  padding:35px 0 25px;
}

.header h1{
  font-size:42px;
  font-weight:900;
  letter-spacing:6px;
}

.header p{
  color:#777;
  margin-top:8px;
}

.card{
  background:#0d0d0d;
  border:1px solid #252525;
  border-radius:20px;
  padding:22px;
}

.primary{
  width:100%;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#000;
  font-weight:900;
  cursor:pointer;
}

.primary:active{
  transform:scale(.98);
}

.devices{
  display:grid;
  grid-template-columns:repeat(
    auto-fit,
    minmax(260px,1fr)
  );
  gap:14px;
  margin-top:20px;
}

.device{
  background:#111;
  border:1px solid #292929;
  border-radius:15px;
  padding:18px;
}

.device h3{
  margin-bottom:10px;
}

.device p{
  color:#777;
  font-size:13px;
  margin:7px 0;
  word-break:break-all;
}

.status{
  display:inline-block;
  background:#1d1d1d;
  padding:6px 10px;
  border-radius:20px;
  font-size:11px;
  margin-bottom:10px;
}

.device button{
  width:100%;
  padding:11px;
  margin-top:8px;
  background:#191919;
  color:#fff;
  border:1px solid #333;
  border-radius:9px;
  cursor:pointer;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:430px;
  max-height:90vh;
  overflow-y:auto;
  background:#0d0d0d;
  border:1px solid #333;
  border-radius:20px;
  padding:22px;
}

.modal-box h2{
  text-align:center;
  margin-bottom:8px;
}

.modal-box > p{
  text-align:center;
  color:#777;
  font-size:13px;
  line-height:1.5;
  margin-bottom:18px;
}

.option{
  width:100%;
  padding:13px;
  background:#171717;
  color:#fff;
  border:1px solid #333;
  border-radius:10px;
  margin-top:8px;
  cursor:pointer;
}

.area{
  display:none;
  margin-top:18px;
}

input{
  width:100%;
  padding:14px;
  background:#151515;
  color:#fff;
  border:1px solid #333;
  border-radius:10px;
  outline:none;
  margin-bottom:10px;
  font-size:15px;
}

input:focus{
  border-color:#777;
}

.code{
  text-align:center;
  font-size:28px;
  font-weight:900;
  letter-spacing:5px;
  padding:20px 0;
  word-break:break-all;
}

.qr{
  display:none;
  width:290px;
  max-width:100%;
  margin:10px auto;
  padding:10px;
  background:#fff;
  border-radius:10px;
}

.message{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:10px;
  line-height:1.5;
}

.close{
  width:100%;
  margin-top:12px;
  padding:12px;
  background:#111;
  color:#fff;
  border:1px solid #333;
  border-radius:10px;
  cursor:pointer;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  color:#666;
  padding:25px;
}

@media(max-width:500px){
  body{
    padding:12px;
  }

  .header h1{
    font-size:34px;
  }

  .card{
    padding:15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>ADEZ-MD</h1>
    <p>Multi-Device WhatsApp Pairing</p>
  </div>

  <div class="card">

    <button
      class="primary"
      onclick="newDevice()"
    >
      + PAIR NEW DEVICE
    </button>

    <div
      id="devices"
      class="devices"
    ></div>

  </div>

</div>


<!-- MODAL -->

<div
  id="modal"
  class="modal"
>

  <div class="modal-box">

    <h2>ADEZ-MD Device</h2>

    <p>
      Choose how you want to connect
      this WhatsApp account.
    </p>

    <button
      class="option"
      onclick="showPairing()"
    >
      📱 PHONE NUMBER
    </button>

    <button
      class="option"
      onclick="showQR()"
    >
      🔳 QR CODE
    </button>


    <!-- PAIRING CODE -->

    <div
      id="pairArea"
      class="area"
    >

      <input
        id="phone"
        type="tel"
        inputmode="numeric"
        placeholder="254712345678"
      >

      <button
        class="primary"
        onclick="getPairingCode()"
      >
        GET PAIRING CODE
      </button>

      <div
        id="code"
        class="code"
      ></div>

      <div
        id="pairMessage"
        class="message"
      ></div>

    </div>


    <!-- QR -->

    <div
      id="qrArea"
      class="area"
    >

      <img
        id="qr"
        class="qr"
        alt="ADEZ-MD QR Code"
      >

      <div
        id="qrMessage"
        class="message"
      >
        Waiting for QR code...
      </div>

    </div>


    <button
      class="close"
      onclick="closeModal()"
    >
      CLOSE
    </button>

  </div>

</div>


<script>

let currentDevice = null;
let qrTimer = null;


/*
|--------------------------------------------------------------------------
| Create new device
|--------------------------------------------------------------------------
*/

async function newDevice(){

  try{

    const response =
      await fetch(
        "/api/device/create",
        {
          method:"POST"
        }
      );

    const data =
      await response.json();

    if(!data.success){

      alert(
        data.message ||
        "Could not create device."
      );

      return;
    }

    currentDevice =
      data.deviceId;

    openModal();

    loadDevices();

  }catch(error){

    console.error(error);

    alert(
      "Unable to connect to ADEZ-MD server."
    );

  }

}


/*
|--------------------------------------------------------------------------
| Load all devices
|--------------------------------------------------------------------------
*/

async function loadDevices(){

  try{

    const response =
      await fetch(
        "/api/devices"
      );

    const data =
      await response.json();

    const box =
      document.getElementById(
        "devices"
      );

    box.innerHTML = "";

    if(
      !data.success ||
      !data.devices.length
    ){

      box.innerHTML = `
        <div class="empty">
          No devices connected yet.
        </div>
      `;

      return;
    }


    data.devices.forEach(
      device => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "device";

        div.innerHTML = `

          <h3>
            📱 ADEZ-MD Device
          </h3>

          <span class="status">
            ${escapeHtml(device.status)}
          </span>

          <p>
            ID:
            ${escapeHtml(device.id)}
          </p>

          <p>
            Phone:
            ${escapeHtml(
              device.phone ||
              "Not paired"
            )}
          </p>

          <button
            onclick="manageDevice('${device.id}')"
          >
            MANAGE
          </button>

          <button
            onclick="logoutDevice('${device.id}')"
          >
            LOGOUT
          </button>

        `;

        box.appendChild(div);

      }
    );

  }catch(error){

    console.error(
      "Device loading error:",
      error
    );

  }

}


/*
|--------------------------------------------------------------------------
| Manage existing device
|--------------------------------------------------------------------------
*/

function manageDevice(id){

  currentDevice = id;

  openModal();

}


/*
|--------------------------------------------------------------------------
| Open modal
|--------------------------------------------------------------------------
*/

function openModal(){

  document
    .getElementById("modal")
    .classList.add("show");

  document
    .getElementById("pairArea")
    .style.display = "none";

  document
    .getElementById("qrArea")
    .style.display = "none";

  document
    .getElementById("code")
    .textContent = "";

  document
    .getElementById("pairMessage")
    .textContent = "";

}


/*
|--------------------------------------------------------------------------
| Phone pairing
|--------------------------------------------------------------------------
*/

function showPairing(){

  document
    .getElementById("pairArea")
    .style.display =
      "block";

  document
    .getElementById("qrArea")
    .style.display =
      "none";

}


/*
|--------------------------------------------------------------------------
| Generate pairing code
|--------------------------------------------------------------------------
*/

async function getPairingCode(){

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();

  const message =
    document
      .getElementById(
        "pairMessage"
      );

  if(!phone){

    message.textContent =
      "Enter your phone number with country code.";

    return;
  }

  message.textContent =
    "Generating pairing code...";


  try{

    const response =
      await fetch(
        `/api/device/${currentDevice}/pair`,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            number:phone
          })

        }
      );


    const data =
      await response.json();


    if(data.success){

      document
        .getElementById("code")
        .textContent =
          data.code;

      message.textContent =
        "Open WhatsApp → Linked devices → Link a device → Link with phone number, then enter the code.";

      loadDevices();

    }else{

      message.textContent =
        data.message ||
        "Pairing failed.";

    }

  }catch(error){

    console.error(error);

    message.textContent =
      "Server connection failed.";

  }

}


/*
|--------------------------------------------------------------------------
| Show QR
|--------------------------------------------------------------------------
*/

function showQR(){

  document
    .getElementById("pairArea")
    .style.display =
      "none";

  document
    .getElementById("qrArea")
    .style.display =
      "block";

  loadQR();

}


/*
|--------------------------------------------------------------------------
| Load QR
|--------------------------------------------------------------------------
*/

async function loadQR(){

  if(!currentDevice)
    return;

  const image =
    document.getElementById(
      "qr"
    );

  const message =
    document.getElementById(
      "qrMessage"
    );

  message.textContent =
    "Waiting for QR code...";


  try{

    const response =
      await fetch(
        `/api/device/${currentDevice}/qr`
      );

    const data =
      await response.json();


    if(data.success){

      image.src =
        data.qr;

      image.style.display =
        "block";

      message.textContent =
        "Scan the QR code with WhatsApp.";

    }else{

      image.style.display =
        "none";

      message.textContent =
        "Waiting for WhatsApp QR code...";

      clearTimeout(qrTimer);

      qrTimer =
        setTimeout(
          loadQR,
          2000
        );

    }

  }catch(error){

    console.error(
      "QR error:",
      error
    );

    message.textContent =
      "Unable to load QR code.";

  }

}


/*
|--------------------------------------------------------------------------
| Logout
|--------------------------------------------------------------------------
*/

async function logoutDevice(id){

  const confirmed =
    confirm(
      "Logout this WhatsApp device?"
    );

  if(!confirmed)
    return;


  try{

    const response =
      await fetch(
        `/api/device/${id}/logout`,
        {
          method:"POST"
        }
      );

    const data =
      await response.json();

    if(!data.success){

      alert(
        data.message ||
        "Logout failed."
      );

      return;
    }

    loadDevices();

  }catch(error){

    alert(
      "Server connection failed."
    );

  }

}


/*
|--------------------------------------------------------------------------
| Close modal
|--------------------------------------------------------------------------
*/

function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("show");

  clearTimeout(qrTimer);

  currentDevice = null;

}


/*
|--------------------------------------------------------------------------
| Basic HTML escaping
|--------------------------------------------------------------------------
*/

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/*
|--------------------------------------------------------------------------
| Initial load
|--------------------------------------------------------------------------
*/

loadDevices();


/*
|--------------------------------------------------------------------------
| Refresh device statuses
|--------------------------------------------------------------------------
*/

setInterval(
  loadDevices,
  5000
);

</script>

</body>
</html>
